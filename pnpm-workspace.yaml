allowBuilds:
  '@parcel/watcher': false
  '@tailwindcss/oxide': true
  esbuild: false
  koffi: false
  sharp: false
  unrs-resolver: false
minimumReleaseAgeExclude:
  - '@next/eslint-plugin-next@16.4.5'
  - 'eslint-config-next@16.4.5'
  - 'vercel@65.11.0'
  - '@vercel/cli-support@65.11.0'
  - '@vercel/vc-native-darwin-arm64@65.11.0'
  - '@vercel/vc-native-darwin-x64@65.11.0'
  - '@vercel/vc-native-linux-arm64-musl@65.11.0'
  - '@vercel/vc-native-linux-arm64@65.11.0'
  - '@vercel/vc-native-linux-x64-musl@65.11.0'
  - '@vercel/vc-native-linux-x64@65.11.0'
  - '@vercel/vc-native-win32-arm64@65.11.0'
  - '@vercel/vc-native-win32-x64@65.11.0'
peerDependencyRules:
  allowedVersions:
    react: '>=18'
    react-dom: '>=18'
